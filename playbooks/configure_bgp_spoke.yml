---
- name: Read Nautobot facts for FortiGate Hubs
  hosts: fortigates
  gather_facts: false
  tasks:
    - name: Read Nautobot facts for {{ inventory_hostname }}
      ansible.builtin.include_role:
        name: nautobot_facts
        
- name: Configure BGP on FortiGate
  hosts: fortigate_spokes
  gather_facts: false

  module_defaults:
    group/fortinet.fortios.fortios:
      access_token: "{{ vault_fortios_token }}"
      vdom: "{{ vdom }}"

  tasks:
    - name: Configure router bgp
      fortinet.fortios.fortios_router_bgp:
        router_bgp:
          as: "{{ bgp_asn }}"
          router_id: "{{ ip_wan1.split('/')[0] }}"
          ibgp_multipath: enable
          additional_path: enable
          graceful_restart: enable
          neighbor:
            - ip: "{{ hostvars[item].ip_lo_ipsec01.split('/')[0] }}"
              capability_graceful_restart: enable
              link_down_failover: enable
              next_hop_self: enable
              soft_reconfiguration: enable
              remote_as: "{{ bgp_asn }}"
              update_source: "{{ int_lo_ipsec01 }}"
              keep_alive_timer: 5
              holdtime_timer: 15
              advertisement_interval: 2
              connect_timer: 1
            - ip: "{{ hostvars[item].ip_lo_ipsec02.split('/')[0] }}"
              capability_graceful_restart: enable
              link_down_failover: enable
              next_hop_self: enable
              soft_reconfiguration: enable
              remote_as: "{{ bgp_asn }}"
              update_source: "{{ int_lo_ipsec02 }}"
              keep_alive_timer: 5
              holdtime_timer: 15
              advertisement_interval: 2
              connect_timer: 1
          network:
            - id: 1
              prefix: "{{ip_lo_testing}}"
      loop: "{{ groups['fortigate_hubs'] }}"
      loop_control:
        label: "{{ item }}"


    - name: Create BGP objects for IPSEC01 and IPSEC02
      fortinet.fortios.fortios_firewall_address:
        state: present
        firewall_address:
          name: "{{ item.name }}"
          subnet: "{{ item.subnet }}"
      loop:
      - { name: "{{ ip_lo_testing }}", subnet: "{{ ip_lo_testing }}" }
      - { name: "{{ ip_lo_ipsec01 }}", subnet: "{{ ip_lo_ipsec01 }}" }
      - { name: "{{ ip_lo_ipsec02 }}", subnet: "{{ ip_lo_ipsec02 }}" }


    - name: Create BGP firewall policy for testing BGP traffic
      fortinet.fortios.fortios_firewall_policy:
        state: present
        firewall_policy:
          name: "test_ping_allow"
          policyid: "1"
          srcintf: 
            - name: "{{ int_lo_testing }}"
          dstintf: 
            - name: "{{ zone_overlay }}"
          srcaddr:
            - name: "{{ip_lo_testing}}"
          dstaddr:
            - name: "{{ip_lo_testing}}"
          action: accept
          schedule: "always"
          logtraffic: all
          service:
            - name: "PING"

    - name: Display result
      debug:
        msg: 
        - "{{ inventory_hostname }} -> BGP AS {{ bgp_asn }} configured with loopback {{ ip_lo_ipsec01 }}"
        - "{{ inventory_hostname }} -> BGP AS {{ bgp_asn }} configured with neighbor-range {{ ip_lo_ipsec02 }}"